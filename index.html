<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evolution World</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0 5px;
}

#stats {
    margin: 10px;
    font-size: 18px;
}

canvas {
    border: 2px solid white;
    background: #183b20;
    max-width: 95%;
}

button {
    margin: 10px 5px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

</style>
</head>

<body>

<h1>🌎 EVOLUTION WORLD</h1>

<div id="stats">

Year:
<span id="year">0</span>

|

Population:
<span id="population">0</span>

</div>

<canvas id="world" width="800" height="500"></canvas>

<br>

<button id="startButton">START</button>

<button id="pauseButton">PAUSE</button>

<button id="resetButton">RESET</button>


<script>

const canvas = document.getElementById("world");

const ctx = canvas.getContext("2d");


const yearDisplay =
document.getElementById("year");

const populationDisplay =
document.getElementById("population");


const startButton =
document.getElementById("startButton");

const pauseButton =
document.getElementById("pauseButton");

const resetButton =
document.getElementById("resetButton");


let organisms = [];

let food = [];

let year = 0;

let running = false;


const WORLD_WIDTH = canvas.width;

const WORLD_HEIGHT = canvas.height;



// =================================
// CREATE FOOD
// =================================

function createFood() {

    food.push({

        x: Math.random() * WORLD_WIDTH,

        y: Math.random() * WORLD_HEIGHT

    });

}



// =================================
// CREATE ORGANISM
// =================================

function createOrganism(x, y) {

    organisms.push({

        x: x,

        y: y,

        energy: 100,

        age: 0,

        speed: 1 + Math.random() * 2,

        vision: 50 + Math.random() * 50,

        metabolism: 0.05 + Math.random() * 0.1,

        reproductionCooldown: 0

    });

}



// =================================
// RESET WORLD
// =================================

function resetWorld() {

    organisms = [];

    food = [];

    year = 0;

    running = false;


    // Starting organisms

    for (let i = 0; i < 10; i++) {

        createOrganism(

            Math.random() * WORLD_WIDTH,

            Math.random() * WORLD_HEIGHT

        );

    }


    // Starting food

    for (let i = 0; i < 100; i++) {

        createFood();

    }


    updateStats();

    drawWorld();

}



// =================================
// UPDATE WORLD
// =================================

function updateWorld() {


    for (let organism of organisms) {


        // =============================
        // FIND NEAREST FOOD
        // =============================

        let nearestFood = null;

        let nearestDistance = Infinity;


        for (let f of food) {

            let dx =
            organism.x - f.x;

            let dy =
            organism.y - f.y;


            let distance =
            Math.sqrt(dx * dx + dy * dy);


            if (
                distance < nearestDistance &&
                distance < organism.vision
            ) {

                nearestDistance = distance;

                nearestFood = f;

            }

        }


        // =============================
        // MOVE TOWARD FOOD
        // =============================

        if (nearestFood) {

            let dx =
            nearestFood.x - organism.x;

            let dy =
            nearestFood.y - organism.y;


            let distance =
            Math.sqrt(dx * dx + dy * dy);


            if (distance > 0) {

                organism.x +=
                (dx / distance) *
                organism.speed;

                organism.y +=
                (dy / distance) *
                organism.speed;

            }

        }


        // =============================
        // RANDOM MOVEMENT
        // =============================

        else {

            organism.x +=
            (Math.random() - 0.5) *
            organism.speed;

            organism.y +=
            (Math.random() - 0.5) *
            organism.speed;

        }


        // =============================
        // KEEP INSIDE WORLD
        // =============================

        organism.x =
        Math.max(
            0,
            Math.min(
                WORLD_WIDTH,
                organism.x
            )
        );


        organism.y =
        Math.max(
            0,
            Math.min(
                WORLD_HEIGHT,
                organism.y
            )
        );


        // =============================
        // ENERGY
        // =============================

        organism.energy -=
        organism.metabolism;


        // =============================
        // AGE
        // =============================

        organism.age += 0.01;


        // =============================
        // REPRODUCTION COOLDOWN
        // =============================

        if (
            organism.reproductionCooldown > 0
        ) {

            organism.reproductionCooldown--;

        }



        // =============================
        // EAT FOOD
        // =============================

        for (
            let i = food.length - 1;
            i >= 0;
            i--
        ) {

            let f = food[i];


            let dx =
            organism.x - f.x;

            let dy =
            organism.y - f.y;


            let distance =
            Math.sqrt(dx * dx + dy * dy);


            if (distance < 10) {

                organism.energy += 25;

                food.splice(i, 1);

                break;

            }

        }

    }



    // =================================
    // DEATH
    // =================================

    organisms =
    organisms.filter(function(organism) {

        return (

            organism.energy > 0 &&

            organism.age < 100

        );

    });



    // =================================
    // REPRODUCTION
    // =================================

    let newOrganisms = [];


    for (let organism of organisms) {


        if (

            organism.energy > 160 &&

            organism.reproductionCooldown <= 0 &&

            organism.age > 2

        ) {

            organism.energy -= 80;

            organism.reproductionCooldown = 300;


            newOrganisms.push({

                x:
                organism.x +
                (Math.random() - 0.5) * 20,


                y:
                organism.y +
                (Math.random() - 0.5) * 20,


                energy: 100,

                age: 0,


                // =============================
                // MUTATED SPEED
                // =============================

                speed:
                Math.max(

                    0.2,

                    organism.speed +

                    (Math.random() - 0.5) *
                    0.2

                ),


                // =============================
                // MUTATED VISION
                // =============================

                vision:
                Math.max(

                    10,

                    organism.vision +

                    (Math.random() - 0.5) *
                    10

                ),


                // =============================
                // MUTATED METABOLISM
                // =============================

                metabolism:
                Math.max(

                    0.01,

                    organism.metabolism +

                    (Math.random() - 0.5) *
                    0.02

                ),


                reproductionCooldown: 300

            });

        }

    }


    organisms.push(...newOrganisms);



    // =================================
    // ADD FOOD
    // =================================

    if (food.length < 100) {

        createFood();

    }



    // =================================
    // TIME
    // =================================

    year += 0.01;


    updateStats();

}



// =================================
// DRAW WORLD
// =================================

function drawWorld() {


    ctx.clearRect(

        0,

        0,

        WORLD_WIDTH,

        WORLD_HEIGHT

    );


    // =============================
    // DRAW FOOD
    // =============================

    for (let f of food) {

        ctx.fillStyle = "lime";


        ctx.fillRect(

            f.x,

            f.y,

            4,

            4

        );

    }



    // =============================
    // DRAW ORGANISMS
    // =============================

    for (let organism of organisms) {

        ctx.fillStyle = "cyan";


        ctx.beginPath();


        ctx.arc(

            organism.x,

            organism.y,

            6,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }

}



// =================================
// UPDATE STATS
// =================================

function updateStats() {

    yearDisplay.textContent =
    Math.floor(year);


    populationDisplay.textContent =
    organisms.length;

}



// =================================
// MAIN LOOP
// =================================

function gameLoop() {


    if (running) {

        updateWorld();

        drawWorld();

    }


    requestAnimationFrame(gameLoop);

}



// =================================
// BUTTONS
// =================================

startButton.addEventListener(

    "click",

    function() {

        running = true;

    }

);


pauseButton.addEventListener(

    "click",

    function() {

        running = false;

    }

);


resetButton.addEventListener(

    "click",

    function() {

        resetWorld();

    }

);



// =================================
// START
// =================================

resetWorld();

gameLoop();

</script>

</body>
</html>
